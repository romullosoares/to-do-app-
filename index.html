<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:           #F5F2ED;
      --surface:      #FDFCFA;
      --border:       rgba(0, 0, 0, 0.10);
      --text:         #1A1916;
      --muted:        #7A7872;

      --alta-border:  #D85A30;
      --alta-bg:      #FAECE7;
      --alta-text:    #712B13;
      --alta-dot:     #D85A30;

      --media-border: #BA7517;
      --media-bg:     #FAEEDA;
      --media-text:   #633806;
      --media-dot:    #EF9F27;

      --baixa-border: #3B6D11;
      --baixa-bg:     #EAF3DE;
      --baixa-text:   #27500A;
      --baixa-dot:    #639922;

      --radius:       12px;
      --radius-sm:    8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1rem 4rem;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    header {
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    header p {
      margin-top: 0.4rem;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 300;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.25rem 1rem;
      margin-bottom: 2rem;
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .form-row input[type="text"] {
      flex: 1;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-row input[type="text"]:focus {
      border-color: rgba(0,0,0,0.3);
    }

    .form-row input[type="text"]::placeholder {
      color: #B8B4AC;
    }

    .form-row select {
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .btn-add {
      height: 42px;
      padding: 0 20px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .btn-add:hover { opacity: 0.82; }

    .legend {
      display: flex;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Animação de entrada */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0.85rem 1rem;
      animation: slideIn 0.2s ease;
    }

    .todo-item.alta  { border-left-color: var(--alta-border); }
    .todo-item.media { border-left-color: var(--media-border); }
    .todo-item.baixa { border-left-color: var(--baixa-border); }

    /* Círculo de status clicável */
    .status {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .status:hover {
      border-color: rgba(0,0,0,0.35);
    }

    .status.concluida {
      background: var(--text);
      border-color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status.concluida::after {
      content: '';
      display: block;
      width: 5px;
      height: 9px;
      border-right: 1.5px solid var(--surface);
      border-bottom: 1.5px solid var(--surface);
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .task-text {
      flex: 1;
      font-size: 0.92rem;
      line-height: 1.4;
      transition: color 0.15s;
    }

    .task-text.concluida {
      text-decoration: line-through;
      color: var(--muted);
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 500;
      padding: 2px 9px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge.alta  { background: var(--alta-bg);  color: var(--alta-text);  }
    .badge.media { background: var(--media-bg); color: var(--media-text); }
    .badge.baixa { background: var(--baixa-bg); color: var(--baixa-text); }

    .btn-remove {
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: #C0BDB8;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
      cursor: pointer;
      transition: color 0.15s;
      padding: 0;
    }

    .btn-remove:hover { color: #7A7872; }

    .footer {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Estado vazio */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 300;
    }
  </style>
</head>
<body>

<div class="app">

  <header>
    <h1>Minhas Tarefas</h1>
    <p>Organize seu dia com prioridade.</p>
  </header>

  <div class="form-card">
    <div class="form-row">
      <input type="text" id="taskInput" placeholder="Descreva a tarefa…" />
      <select id="prioritySelect">
        <option value="alta">Alta</option>
        <option value="media" selected>Média</option>
        <option value="baixa">Baixa</option>
      </select>
      <button class="btn-add" id="addBtn">Adicionar</button>
    </div>
    <div class="legend">
      <span class="legend-item">
        <span class="dot" style="background: var(--alta-dot)"></span>Alta
      </span>
      <span class="legend-item">
        <span class="dot" style="background: var(--media-dot)"></span>Média
      </span>
      <span class="legend-item">
        <span class="dot" style="background: var(--baixa-dot)"></span>Baixa
      </span>
    </div>
  </div>

  <p class="section-label">Tarefas pendentes</p>

  <ul class="todo-list" id="todoList"></ul>

  <div class="footer">
    <span id="totalCount">0 tarefas</span>
    <span id="doneCount">0 concluídas</span>
  </div>

</div>

<script>
  // ─── Estado da aplicação ────────────────────────────────────────────────────
  // Array que armazena todos os objetos de tarefa
  const tasks = [
    { id: 1, text: 'Entregar o trabalho de Engenharia de Software', priority: 'alta',  done: false },
    { id: 2, text: 'Revisar anotações da aula de prompt',           priority: 'media', done: false },
    { id: 3, text: 'Criar repositório no GitHub',                   priority: 'baixa', done: true  },
    { id: 4, text: 'Fazer deploy na Vercel',                        priority: 'alta',  done: false },
    { id: 5, text: 'Escrever o README do projeto',                  priority: 'media', done: false },
  ];

  // Contador para gerar IDs únicos para novas tarefas
  let nextId = tasks.length + 1;

  // ─── Referências ao DOM ─────────────────────────────────────────────────────
  const taskInput      = document.getElementById('taskInput');
  const prioritySelect = document.getElementById('prioritySelect');
  const addBtn         = document.getElementById('addBtn');
  const todoList       = document.getElementById('todoList');
  const totalCount     = document.getElementById('totalCount');
  const doneCount      = document.getElementById('doneCount');

  // ─── Rótulos legíveis por prioridade ────────────────────────────────────────
  const priorityLabel = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };

  // ─── Funções principais ─────────────────────────────────────────────────────

  /**
   * Adiciona uma nova tarefa ao array e re-renderiza a lista.
   */
  function addTask() {
    const text = taskInput.value.trim();
    if (!text) {
      // Pequeno shake visual para indicar campo vazio
      taskInput.style.borderColor = 'var(--alta-border)';
      setTimeout(() => taskInput.style.borderColor = '', 600);
      taskInput.focus();
      return;
    }

    tasks.push({
      id:       nextId++,
      text:     text,
      priority: prioritySelect.value,
      done:     false,
    });

    taskInput.value = '';
    taskInput.focus();
    render();
  }

  /**
   * Alterna o estado "concluída" de uma tarefa pelo seu ID.
   * @param {number} id - ID da tarefa a ser alternada
   */
  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.done = !task.done;
      render();
    }
  }

  /**
   * Remove uma tarefa do array pelo seu ID.
   * @param {number} id - ID da tarefa a ser removida
   */
  function removeTask(id) {
    const index = tasks.findIndex(t => t.id === id);
    if (index !== -1) {
      tasks.splice(index, 1);
      render();
    }
  }

  /**
   * Renderiza (re-desenha) toda a lista de tarefas no DOM
   * e atualiza os contadores do rodapé.
   */
  function render() {
    // Limpa a lista atual
    todoList.innerHTML = '';

    if (tasks.length === 0) {
      todoList.innerHTML = '<li class="empty-state">Nenhuma tarefa por aqui ainda.</li>';
    } else {
      tasks.forEach(task => {
        // Cria o elemento <li> para cada tarefa
        const li = document.createElement('li');
        li.className = `todo-item ${task.priority}`;

        // Constrói o HTML interno do item
        li.innerHTML = `
          <div class="status ${task.done ? 'concluida' : ''}" data-id="${task.id}" title="Marcar como concluída"></div>
          <span class="task-text ${task.done ? 'concluida' : ''}">${escapeHtml(task.text)}</span>
          <span class="badge ${task.priority}">${priorityLabel[task.priority]}</span>
          <button class="btn-remove" data-id="${task.id}" title="Remover tarefa">&times;</button>
        `;

        todoList.appendChild(li);
      });
    }

    updateFooter();
  }

  /**
   * Atualiza os textos de contagem no rodapé.
   */
  function updateFooter() {
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;

    totalCount.textContent = `${total} ${total === 1 ? 'tarefa' : 'tarefas'}`;
    doneCount.textContent  = `${done} concluída${done !== 1 ? 's' : ''}`;
  }

  /**
   * Escapa caracteres especiais para evitar XSS ao inserir texto no DOM.
   * @param {string} str - Texto bruto do usuário
   * @returns {string} - Texto seguro para uso em innerHTML
   */
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ─── Event Listeners ────────────────────────────────────────────────────────

  // Botão "Adicionar"
  addBtn.addEventListener('click', addTask);

  // Tecla Enter no campo de texto
  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  // Delegação de eventos na lista:
  // Um único listener captura cliques nos status (toggle) e nos botões de remoção
  todoList.addEventListener('click', (e) => {
    const id = parseInt(e.target.dataset.id);
    if (!id) return;

    if (e.target.classList.contains('status')) {
      toggleTask(id);
    } else if (e.target.classList.contains('btn-remove')) {
      removeTask(id);
    }
  });

  // ─── Inicialização ──────────────────────────────────────────────────────────
  render();
</script>

</body>
</html>
